<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pustaka Modern Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; }
        
        /* Layout */
        .sidebar { background: #ffffff; border-right: 1px solid #e2e8f0; min-height: 100vh; padding: 2.5rem; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); transition: 0.3s; }
        
        /* Inputs */
        .form-control { border-radius: 10px; padding: 0.75rem; border: 1px solid #e2e8f0; background: #fcfcfc; font-size: 0.9rem; }
        .form-control:focus { box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); border-color: var(--primary); }
        
        /* UI Components */
        .table-container { background: white; border-radius: 16px; overflow: hidden; }
        .btn-primary { background: var(--primary); border: none; border-radius: 10px; padding: 0.6rem 1.5rem; font-weight: 600; }
        .btn-success { border-radius: 10px; font-weight: 600; border: none; padding: 0.6rem; }
        .badge { padding: 0.5em 1em; border-radius: 8px; font-weight: 500; }
        .table thead { background: #f1f5f9; }
        .status-box { font-size: 0.8rem; padding: 10px; border-radius: 8px; background: #f1f5f9; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-4 sidebar">
            <h3 class="fw-bold text-primary mb-4">📚 Pustaka.id</h3>
            
            <div class="mb-5">
                <p class="text-muted small fw-bold mb-2 text-uppercase">Admin Access</p>
                <div class="card p-3 shadow-sm">
                    <div class="mb-2">
                        <input type="text" id="username" class="form-control" placeholder="Username">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>
                    <button onclick="login()" class="btn btn-primary w-100">Unlock System</button>
                    <div id="auth-status-box" class="status-box">
                        Status: <span id="status-text" class="text-danger fw-bold">Locked</span><br>
                        <small class="text-muted" id="token-hint">Silahkan login untuk dapatkan token</small>
                    </div>
                </div>
            </div>

            <div>
                <p class="text-muted small fw-bold mb-2 text-uppercase">Management</p>
                <div class="card p-3 shadow-sm">
                    <input type="text" id="judul" class="form-control mb-2" placeholder="Judul Buku">
                    <input type="text" id="penulis" class="form-control mb-2" placeholder="Penulis">
                    <input type="text" id="isbn" class="form-control mb-2" placeholder="ISBN">
                    <div class="row g-2">
                        <div class="col-6"><input type="number" id="tahun" class="form-control mb-2" placeholder="Tahun"></div>
                        <div class="col-6"><input type="number" id="stok" class="form-control mb-2" placeholder="Stok"></div>
                    </div>
                    <button onclick="tambahBuku()" class="btn btn-success w-100 mt-2">➕ Publish Buku</button>
                </div>
            </div>
        </div>

        <div class="col-lg-8 p-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-0">Inventory Master</h2>
                    <p class="text-muted">Data buku perpustakaan terintegrasi API</p>
                </div>
                <button onclick="fetchBuku()" class="btn btn-outline-primary btn-sm px-4 rounded-pill">🔄 Sync Data</button>
            </div>

            <div class="table-container shadow-sm">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 py-3">Buku & Penulis</th>
                            <th>ISBN</th>
                            <th>Status Stok</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-buku">
                        <tr>
                            <td colspan="4" class="text-center py-5 text-muted">
                                <img src="https://cdn-icons-png.flaticon.com/512/6146/6146680.png" width="50" class="mb-3 opacity-50"><br>
                                Sistem Terkunci. Silahkan Login.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // SESUAIKAN URL INI DENGAN URL DJANGO LU
    const URL_LOGIN = "http://127.0.0.1:8000/api/login/";
    const URL_BUKU = "http://127.0.0.1:8000/api/buku/";
    
    let AUTH_TOKEN = "";

    // 1. FUNGSI LOGIN (POST)
    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        try {
            const res = await fetch(URL_LOGIN, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            const data = await res.json();

            if(res.ok) {
                AUTH_TOKEN = data.token;
                document.getElementById('status-text').innerText = "✅ Authorized";
                document.getElementById('status-text').className = "text-success fw-bold";
                document.getElementById('token-hint').innerText = "Token: " + AUTH_TOKEN;
                alert("Login Sukses! Token berhasil didapat.");
                fetchBuku(); // Langsung load data
            } else {
                alert("Gagal Login: " + (data.non_field_errors || "Username/Password salah"));
            }
        } catch (err) {
            console.error(err);
            alert("Server tidak merespon. Pastikan Django jalan & CORS aktif!");
        }
    }

    // 2. FUNGSI AMBIL DATA (GET)
    async function fetchBuku() {
        if(!AUTH_TOKEN) {
            alert("Harap login dulu untuk mendapatkan akses!");
            return;
        }

        try {
            const res = await fetch(URL_BUKU, {
                method: 'GET',
                headers: { 'Authorization': `Token ${AUTH_TOKEN}` }
            });

            const data = await res.json();
            const container = document.getElementById('tabel-buku');
            container.innerHTML = '';

            // Lu pake DRF Pagination? Kalau iya pake data.results, kalau enggak pake data
            const daftarBuku = data.results ? data.results : data;

            daftarBuku.forEach(b => {
                const stokBadge = b.jumlah_stok > 0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger';
                const stokText = b.jumlah_stok > 0 ? b.jumlah_stok + ' Unit' : 'Habis';

                container.innerHTML += `
                    <tr>
                        <td class="ps-4 py-3">
                            <div class="fw-bold text-dark">${b.judul}</div>
                            <div class="text-muted small">${b.penulis} • ${b.tahun_terbit}</div>
                        </td>
                        <td><code class="text-primary">${b.isbn}</code></td>
                        <td><span class="badge ${stokBadge}">${stokText}</span></td>
                        <td class="text-center">
                            <button onclick="hapusBuku(${b.id})" class="btn btn-sm text-danger border-0">🗑️ Hapus</button>
                        </td>
                    </tr>`;
            });
        } catch (err) {
            console.error(err);
        }
    }

    // 3. FUNGSI TAMBAH DATA (POST)
    async function tambahBuku() {
        if(!AUTH_TOKEN) return alert("Login dulu!");
        
        const bodyData = {
            judul: document.getElementById('judul').value,
            penulis: document.getElementById('penulis').value,
            isbn: document.getElementById('isbn').value,
            tahun_terbit: parseInt(document.getElementById('tahun').value),
            jumlah_stok: parseInt(document.getElementById('stok').value)
        };

        const res = await fetch(URL_BUKU, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Token ${AUTH_TOKEN}`
            },
            body: JSON.stringify(bodyData)
        });

        if(res.ok) {
            alert("Buku berhasil dipublish!");
            fetchBuku();
            // Kosongkan form
            document.getElementById('judul').value = '';
        } else {
            alert("Gagal simpan data. Cek inputan lu!");
        }
    }

    // 4. FUNGSI HAPUS (DELETE)
    async function hapusBuku(id) {
        if(!confirm("Hapus data buku ini dari database?")) return;

        const res = await fetch(`${URL_BUKU}${id}/`, {
            method: 'DELETE',
            headers: { 'Authorization': `Token ${AUTH_TOKEN}` }
        });

        if(res.status === 204) {
            fetchBuku();
        } else {
            alert("Gagal menghapus data.");
        }
    }
</script>
</body>
</html>
