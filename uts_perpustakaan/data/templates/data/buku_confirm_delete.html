<!DOCTYPE html>
<html>
<head>
    <title>Konfirmasi Hapus Buku</title>
</head>
<body>
    <h1>Konfirmasi Penghapusan</h1>
    <p>Apakah Anda yakin ingin menghapus buku: <strong>{{ object.judul }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Ya, Hapus</button>
        <a href="{% url 'buku-detail' object.pk %}">Batal</a>
    </form>
</body>
</html>
