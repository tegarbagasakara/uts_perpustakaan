<h1>Daftar Buku Tersedia</h1>
<ul>
    {% for buku in object_list %}
        <li>{{ buku.judul }} - Penulis: {{ buku.penulis }}</li>
    {% empty %}
        <li>Belum ada data buku yang terdaftar.</li>
    {% endfor %}
</ul>

<h1>Daftar Buku</h1>
<a href="{% url 'buku-create' %}">Tambah Buku Baru</a> <hr>
