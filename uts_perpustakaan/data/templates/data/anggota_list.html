<h1>Daftar Anggota Perpustakaan</h1>
<ul>
    {% for anggota in object_list %}
        <li>{{ anggota.nama_lengkap }} - No. Anggota: {{ anggota.nomor_anggota }}</li>
    {% empty %}
        <li>Belum ada data anggota yang terdaftar.</li>
    {% endfor %}
</ul>

<h1>Daftar Anggota</h1>
<a href="{% url 'anggota-create' %}">Tambah Anggota Baru</a> <hr>
