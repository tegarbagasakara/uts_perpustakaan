<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Perpustakaan Digital{% endblock %}</title>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #333; color: white; padding: 1em; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        main { padding: 20px; min-height: 500px; }
        footer { background-color: #eee; padding: 1em; text-align: center; position: fixed; bottom: 0; width: 100%; }
        h1 { color: #333; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 5px; }
        a { color: #007bff; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'index' %}">🏠 Beranda</a> |
            <a href="{% url 'buku-list' %}">Buku</a> |
            <a href="{% url 'anggota-list' %}">Anggota</a> |
            <a href="{% url 'peminjaman-list' %}">Peminjaman</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Aplikasi Perpustakaan Digital</p>
    </footer>
</body>
</html>
